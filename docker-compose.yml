services:
  web:
    build: .
    volumes:
      - .:/workspace
    ports:
      - "8088:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - VLLM_API_BASE=http://host.docker.internal:8090
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["sh", "-c", "python3 manage.py migrate && python3 manage.py runserver 0.0.0.0:8086"]
