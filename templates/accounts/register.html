{% extends 'base.html' %}

{% block title %}Sign Up - Chatbot Study{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="claude-logo mb-2">
                    <i class="bi bi-chat-dots-fill"></i> Chatbot Study
                </div>
                <p class="text-muted">Create your account</p>
            </div>
            
            <div class="claude-card p-4">
                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" 
                               name="email" 
                               id="id_email" 
                               class="form-control claude-input" 
                               placeholder="you@example.com"
                               required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password1" class="form-label">Password</label>
                        <input type="password" 
                               name="password1" 
                               id="id_password1" 
                               class="form-control claude-input" 
                               placeholder="••••••••"
                               required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password2" class="form-label">Confirm Password</label>
                        <input type="password" 
                               name="password2" 
                               id="id_password2" 
                               class="form-control claude-input" 
                               placeholder="••••••••"
                               required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn claude-btn">
                            Create Account
                        </button>
                    </div>
                </form>
                
                <hr class="claude-divider my-4">
                
                <p class="text-center mb-0">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="claude-link">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
