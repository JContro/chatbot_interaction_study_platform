<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chatbot Study{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            /* Claude (Anthropic) exact colors */
            --claude-bg: #18191b;
            --claude-surface: #1c1e22;
            --claude-surface-hover: #25262b;
            --claude-border: #2e2f33;
            --claude-border-light: #3a3b3f;
            --claude-text: #ececec;
            --claude-text-muted: #8b8b8b;
            --claude-text-dim: #6b6b6b;
            --claude-accent: #d4a574;
            --claude-accent-hover: #e5b885;
            --claude-accent-subtle: rgba(212, 165, 116, 0.15);
            --claude-green: #86a899;
            --claude-green-subtle: rgba(134, 168, 153, 0.15);
            --claude-red: #ef4444;
            --claude-red-subtle: rgba(239, 68, 68, 0.15);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--claude-bg);
            color: var(--claude-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Override Bootstrap dark theme */
        .btn-close {
            filter: invert(1);
        }
        
        .form-control {
            background-color: var(--claude-surface);
            border: 1px solid var(--claude-border);
            color: var(--claude-text);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        
        .form-control:focus {
            background-color: var(--claude-surface);
            border-color: var(--claude-accent);
            color: var(--claude-text);
            box-shadow: 0 0 0 3px var(--claude-accent-subtle);
        }
        
        .form-control::placeholder {
            color: var(--claude-text-dim);
        }
        
        .form-label {
            color: var(--claude-text);
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }
        
        .claude-card {
            background-color: var(--claude-surface);
            border: 1px solid var(--claude-border);
            border-radius: 12px;
            padding: 24px;
        }
        
        .claude-btn {
            background-color: var(--claude-accent);
            color: #18191b;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.15s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .claude-btn:hover {
            background-color: var(--claude-accent-hover);
            color: #18191b;
            transform: translateY(-1px);
        }
        
        .claude-btn:active {
            transform: translateY(0);
        }

        .claude-btn.recording {
            background-color: var(--claude-red);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .claude-btn-outline {
            background-color: transparent;
            color: var(--claude-text);
            border: 1px solid var(--claude-border);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.15s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .claude-btn-outline:hover {
            background-color: var(--claude-surface-hover);
            color: var(--claude-text);
            border-color: var(--claude-border-light);
        }
        
        .claude-input {
            background-color: var(--claude-surface);
            border: 1px solid var(--claude-border);
            color: var(--claude-text);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            width: 100%;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        
        .claude-input:focus {
            background-color: var(--claude-surface);
            border-color: var(--claude-accent);
            color: var(--claude-text);
            box-shadow: 0 0 0 3px var(--claude-accent-subtle);
            outline: none;
        }
        
        .claude-input::placeholder {
            color: var(--claude-text-dim);
        }
        
        .claude-logo {
            color: var(--claude-accent);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        .claude-divider {
            border-color: var(--claude-border);
            opacity: 1;
        }
        
        .claude-link {
            color: var(--claude-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }
        
        .claude-link:hover {
            color: var(--claude-accent-hover);
            text-decoration: underline;
        }
        
        .text-muted {
            color: var(--claude-text-muted) !important;
        }
        
        .border-secondary {
            border-color: var(--claude-border) !important;
        }
        
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }
        
        .message-wrapper {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        
        .message-wrapper.user {
            flex-direction: row-reverse;
        }
        
        .message-user {
            background-color: var(--claude-surface);
            border-radius: 18px 18px 4px 18px;
            padding: 14px 18px;
            margin-left: 50px;
            border: 1px solid var(--claude-border);
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message-wrapper.user .message-user {
            margin-left: 0;
            margin-right: 50px;
            border-radius: 18px 18px 18px 4px;
            background-color: var(--claude-surface-hover);
        }
        
        .message-assistant {
            background-color: transparent;
            border-radius: 18px 18px 18px 4px;
            padding: 14px 18px;
            margin-right: 50px;
            border: none;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message-wrapper.assistant .message-assistant {
            border-left: 2px solid var(--claude-green);
            margin-left: 50px;
        }
        
        .message-wrapper.assistant:first-child .message-assistant {
            border-left-color: var(--claude-accent);
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .avatar-user {
            background-color: var(--claude-accent);
            color: #18191b;
        }
        
        .avatar-assistant {
            background-color: var(--claude-green);
            color: #18191b;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            margin-right: 50px;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--claude-text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--claude-bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--claude-border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--claude-border-light);
        }
        
        /* Alert styling */
        .alert {
            border-radius: 8px;
            border: 1px solid var(--claude-border);
        }
        
        .alert-success {
            background-color: var(--claude-green-subtle);
            color: var(--claude-green);
            border-color: var(--claude-green);
        }
        
        .alert-error, .alert-danger {
            background-color: var(--claude-red-subtle);
            color: var(--claude-red);
            border-color: var(--claude-red);
        }
        
        .alert-warning {
            background-color: var(--claude-accent-subtle);
            color: var(--claude-accent);
            border-color: var(--claude-accent);
        }
        
        .alert-info {
            background-color: rgba(139, 139, 139, 0.15);
            color: var(--claude-text-muted);
            border-color: var(--claude-border);
        }
        
        /* Badge styling */
        .badge {
            font-weight: 500;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
        }
        
        /* Navbar styling */
        .claude-nav {
            background-color: var(--claude-surface);
            border-bottom: 1px solid var(--claude-border);
            padding: 12px 20px;
        }
        
        /* Input group styling */
        .input-group-text {
            background-color: var(--claude-surface);
            border: 1px solid var(--claude-border);
            color: var(--claude-text-muted);
        }
        
        /* Checkbox styling */
        .form-check-input {
            background-color: var(--claude-surface);
            border-color: var(--claude-border);
        }
        
        .form-check-input:checked {
            background-color: var(--claude-accent);
            border-color: var(--claude-accent);
        }
        
        .form-check-label {
            color: var(--claude-text);
        }
        
        /* Select styling */
        .form-select {
            background-color: var(--claude-surface);
            border: 1px solid var(--claude-border);
            color: var(--claude-text);
        }
        
        .form-select:focus {
            border-color: var(--claude-accent);
            box-shadow: 0 0 0 3px var(--claude-accent-subtle);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if risks %}
    <nav class="claude-nav">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <span class="text-muted me-3">Risks:</span>
                {% for risk in risks %}
                    <span class="badge bg-secondary me-2">{{ risk }}</span>
                {% endfor %}
            </div>
        </div>
    </nav>
    {% endif %}
    
    {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    
    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
